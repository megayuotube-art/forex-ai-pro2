name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pillow

    - name: Build Windows EXE with fundamental_radar
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "ForexAI_2pro" --add-data "fundamental_radar.py;." main.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ForexAI-2pro-Windows-EXE
        path: dist/ForexAI_2pro.exe
