workflows:
  flet-android-build:
    name: Build Flet Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Set up Python
        script: |
          python3 --version
      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade pip
          pip install flet requests yfinance pandas numpy
      - name: Build APK with Flet
        script: |
          yes y | flet build apk --verbose
    artifacts:
      - build/flutter/build/app/outputs/flutter-apk/app-release.apk
